[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnose-eeg-preprocessing"
version = "0.1.0"
description = "Somnotate-based EEG preprocessing and scoring pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Harris Lab"}]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypnose_eeg_preprocessing*"]
